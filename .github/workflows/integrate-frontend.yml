name: Integrate frontend runtime

on:
  push:
    branches:
      - polish/jobo-teen-ui

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject runtime scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="app-integration.js"></script>'
          if marker not in text:
              injection = '\n<script src="supabase-config.js"></script>\n<script src="app-integration.js"></script>\n'
              if '</body>' in text:
                  text = text.replace('</body>', injection + '</body>', 1)
              else:
                  text += injection
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No frontend injection changes needed.'
          else
            git commit -m 'build: wire Supabase runtime into frontend'
            git push
          fi
